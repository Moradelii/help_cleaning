<html lang="en">
  <head>

    <meta name="author" content="Jireh Professional Cleaning Services, LLC" />
    <meta name="theme-color" content="#26302F" />
    
    <!-- ✅ Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Jireh Professional Cleaning Services" />
    <meta property="twitter:description" content="A Cleaner Space. A Better Feeling. Serving Daytona Beach & Surrounding Areas." />

    <title>Jireh Professional Cleaning Services | Daytona Beach, FL</title>
    
    <!-- ✅ Favicon Actualizado -->
    <link rel="icon" type="image/png" href="/logo/icon.png" />
    <link rel="apple-touch-icon" href="/logo/icon.png" />

    <!-- ✅ Preconnect para rendimiento -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- ✅ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ✅ Tailwind CSS (CDN para desarrollo rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ✅ Configuración de Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#26302F',    // Verde oscuro elegante
              secondary: '#DCCBB5',  // Beige/Dorado suave
              accent: '#51483F',     // Marrón tierra
              light: '#FCFBF8',      // Blanco crema fondo
              soft: '#EDFEFF',       // Azul muy claro
              mint: '#EDFFFA'        // Verde menta muy claro
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            }
          }
        }
      }
    </script>

    <style>
      /* ✅ Smooth scrolling */
      html { scroll-behavior: smooth; }
      /* ✅ Ocultar scrollbar horizontal */
      body { overflow-x: hidden; }
      /* ✅ Mejoras de accesibilidad */
      :focus-visible { outline: 2px solid #DCCBB5; outline-offset: 2px; }
    </style>
  </head>
  
  <body class="bg-[#FCFBF8] text-[#26302F] antialiased">
    <!-- ✅ Root donde se monta React -->
    <div id="root">
      <!-- ✅ Loading state mientras carga React -->
      <div class="flex items-center justify-center min-h-screen">
        <div class="text-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#26302F] mx-auto mb-4"></div>
          <p class="text-[#26302F] font-serif text-lg">Loading Jireh...</p>
        </div>
      </div>
    </div>

    <!-- ✅ Entry point de React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
